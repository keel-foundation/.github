name: python-ci

on:
  workflow_call:
    inputs:
      requirements_file:
        description: Optional lockfile to install instead of the package extras
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements_file || 'pyproject.toml' }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ inputs.requirements_file }}" ]; then
            python -m pip install -r "${{ inputs.requirements_file }}"
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
