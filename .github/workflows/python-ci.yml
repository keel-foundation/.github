name: python-ci

on:
  workflow_call:
    inputs:
      requirements_file:
        description: Optional lockfile to install instead of the package extras
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements_file || 'pyproject.toml' }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ inputs.requirements_file }}" ]; then
            python -m pip install -r "${{ inputs.requirements_file }}"
            python -m pip install -e . --no-deps
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
