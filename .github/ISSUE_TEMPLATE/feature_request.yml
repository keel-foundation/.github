name: Feature request
description: Propose a feature or protocol change
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      placeholder: keel-spec
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What creator or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: rfc
    attributes:
      label: RFC
      options:
        - label: This is a protocol or governance change and may require an RFC.
          required: false
